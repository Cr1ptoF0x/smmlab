services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: smmlab-app
    ports:
      - "8000:80"
    volumes:
      - ./Files:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    networks:
      - smmlab-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: smmlab-db
    ports:
      - "3307:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smmlab}
      MYSQL_USER: ${MYSQL_USER:-smmlab_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
    volumes:
      - smmlab-db-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smmlab-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: smmlab-phpmyadmin
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smmlab-network
    restart: unless-stopped

volumes:
  smmlab-db-data:

networks:
  smmlab-network:
    driver: bridge
