services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: smmlab-app
    ports:
      - "8000:80"
    volumes:
      - ./Files:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    networks:
      - smmlab-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: smmlab-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: smmlab_root_2024
      MYSQL_DATABASE: smmlab
      MYSQL_USER: smmlab_user
      MYSQL_PASSWORD: smmlab_pass_2024
    volumes:
      - smmlab-db-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psmmlab_root_2024"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smmlab-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: smmlab-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: smmlab_root_2024
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smmlab-network
    restart: unless-stopped

volumes:
  smmlab-db-data:

networks:
  smmlab-network:
    driver: bridge
